<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Roue de la Fortune - Douanes by Trump</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      color: #a94442;
      margin-bottom: 20px;
      text-align: center;
    }

    .wheel-container {
      position: relative;
      width: 90vmin;
      height: 90vmin;
      max-width: 500px;
      max-height: 500px;
    }

    .wheel {
      width: 100%;
      height: 100%;
      
      transform-origin: center;
    }

    #pointer {
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 20px solid #5cb85c;
      position: absolute;
      margin-top: -1.5em;
      left: 48%;
      /* transform: translateX(-90%); */
      transform: rotate(180deg);
      z-index: 10;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      background-color: #5bc0de;
      border: none;
      border-radius: 10px;
      color: white;
    }

    .label {
      font-size: 0.6em;
      fill: rgb(240, 240, 240);
      text-anchor: middle;
      dominant-baseline: middle;
      font-weight: bold;
      pointer-events: none; /* pour éviter les clics */
    }


    #trump-quote {
      margin-top: 20px;
      max-width: 80%;
      text-align: center;
      font-style: italic;
      color: #333;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Donald's Douane Roulette</h1>
  <div class="wheel-container">
    <div id="pointer"></div>
    <svg id="wheel" class="wheel" viewBox="-150 -150 300 300" xmlns="http://www.w3.org/2000/svg">
      <g id="wheelGroup">
        <!-- Sections -->
        <path d="M0 0 L150 0 A150 150 0 0 1 106.07 106.07 Z" fill="#FF0000" />
        <path d="M0 0 L106.07 106.07 A150 150 0 0 1 0 150 Z" fill="#FF7F00" />
        <path d="M0 0 L0 150 A150 150 0 0 1 -106.07 106.07 Z" fill="#909090" />
        <path d="M0 0 L-106.07 106.07 A150 150 0 0 1 -150 0 Z" fill="#FF8282" />
        <path d="M0 0 L-150 0 A150 150 0 0 1 -106.07 -106.07 Z" fill="#0000FF" />
        <path d="M0 0 L-106.07 -106.07 A150 150 0 0 1 0 -150 Z" fill="#4B0082" />
        <path d="M0 0 L0 -150 A150 150 0 0 1 106.07 -106.07 Z" fill="#8B00FF" />
        <path d="M0 0 L106.07 -106.07 A150 150 0 0 1 150 0 Z" fill="#FF1493" />

        <!-- Labels -->
        <text class="label" x="75" y="0" transform="rotate(0 75 0)">
          <tspan x="75" dy="0.9em">UE : 80%</tspan>
        </text>
        <text class="label" x="53" y="53" transform="rotate(45 53 53)">
          <tspan x="53" dy="0.9em">China : 125%</tspan>
        </text>
        <text class="label" x="0" y="75" transform="rotate(90 0 75)">
          <tspan x="0" dy="0.9em">Brazil : 50%</tspan>
        </text>
        <text class="label" x="-53" y="53" transform="rotate(135 -53 53)">
          <tspan x="-53" dy="0.9em">Indonesia: 95%</tspan>
        </text>
        <text class="label" x="-75" y="0" transform="rotate(180 -75 0)">
          <tspan x="-75" dy="0.9em">Russia: 0%</tspan>
        </text>
        <text class="label" x="-53" y="-53" transform="rotate(-135 -53 -53)">
          <tspan x="-53" dy="0.9em">All the world : 10%</tspan>
        </text>
        <text class="label" x="0" y="-75" transform="rotate(-90 0 -75)">
          <tspan x="0" dy="0.9em">Ok, China 300%</tspan>
          <tspan x="0" dy="1.2em">but Russia 0%</tspan> 
        </text>
        <text class="label" x="53" y="-53" transform="rotate(-45 53 -53)">
          <tspan x="53" dy="0.9em">5% even days,</tspan>
          <tspan x="53" dy="1.2em">90% odd days</tspan>
        </text>
      </g>
    </svg>
  </div>
  <button onclick="spinWheel()">Tourner la roue !</button>
  <div id="trump-quote"></div>

  <script>
    const wheelGroup = document.getElementById('wheelGroup');
    const quoteBox = document.getElementById('trump-quote');
  
    let isSpinning = false;

    const quotes = {
      0: "China? 300% when they’re naughty. Russia? Zero. We know how to deal.",
      1: "Even days, 5%. Odd days, 90%. That’s called strategy, people!",
      2: "The EU? Disastrous deals. We made them pay — 80%, folks. Fair and square!",
      3: "China? They’re killing us on trade. 125% tariff — I fixed it. You're welcome.",
      4: "Brazil's got coffee. We've got tariffs. Big tariffs. Best tariffs.",
      5: "Indonesia? Very nice people, but we had to do 95%. It’s all about America first!",
      6: "Russia’s fine. We’re friends. No tariffs. But watch them.",
      7: "Everybody gets 10%. Fair, right? But only for 90 days — we play hard."
    };

    let currentRotation = 0;
  
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }
  
    function spinWheel() {
      if (isSpinning) return;
  
      isSpinning = true;
      const totalSpin = 360 * 5 + Math.floor(Math.random() * 360); // entre 1800 et 2160°
      const duration = 4000; // en ms
      const start = performance.now();
      const startRotation = currentRotation;
  
      function animate(now) {
        const elapsed = now - start;
        const t = Math.min(elapsed / duration, 1); // normalisé [0, 1]
        const easedT = easeOutCubic(t);
        const angle = startRotation + easedT * totalSpin;
        currentRotation = angle;
        wheelGroup.setAttribute('transform', `rotate(${angle % 360})`);
  
        if (t < 1) {
          requestAnimationFrame(animate);
        } else {
          // Déterminer le secteur final
          const finalAngle = angle % 360;
          const sector = Math.floor(((360 - finalAngle) % 360) / 45);

          quoteBox.textContent = quotes[sector] || "No quote for this sector!";

          isSpinning = false;
        }
      }
  
      requestAnimationFrame(animate);
    }
  </script>
  
</body>
</html>
